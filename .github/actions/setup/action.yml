name: Set up the build
description: Build tools, nghttp2 (cached), Nim and the nimble dependencies
inputs:
  token:
    description: GitHub token for the Nim installer
    required: true
  extra-packages:
    description: Further apt packages
    default: ""
runs:
  using: composite
  steps:
    - name: Build tools
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake zlib1g-dev xz-utils ${{ inputs.extra-packages }}
    - name: nghttp2 cache
      id: ng
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/nghttp2
        key: nghttp2-1.68.0-${{ runner.os }}
    - name: Build nghttp2 (static, as docs/building.md)
      if: steps.ng.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSLO "https://github.com/nghttp2/nghttp2/releases/download/v1.68.0/nghttp2-1.68.0.tar.xz"
        tar xf nghttp2-1.68.0.tar.xz
        cd nghttp2-1.68.0
        cmake -S . -B build -DENABLE_LIB_ONLY=ON -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_STATIC_LIBS=ON -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/nghttp2
        cmake --build build -j
        sudo cmake --install build
    - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
      with:
        nim-version: 2.2.14
        repo-token: ${{ inputs.token }}
    - name: Nimble dependencies
      shell: bash
      run: nimble install -y --depsOnly
