name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NGHTTP2_VERSION: 1.68.0

jobs:
  test:
    name: tests (${{ matrix.mode }}, Nim ${{ matrix.nim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, asan, coverage]
        # the oldest Nim that nimgrpc.nimble allows, and the current stable one (Renovate moves the second)
        nim: ["2.2.12", "2.2.14"]
        exclude:
          - mode: coverage          # one Nim version is enough for the coverage figure
            nim: "2.2.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake zlib1g-dev xz-utils
      - name: nghttp2 cache
        id: ng
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/nghttp2
          key: nghttp2-${{ env.NGHTTP2_VERSION }}-${{ runner.os }}
      - name: Build nghttp2 (static, as docs/building.md)
        if: steps.ng.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://github.com/nghttp2/nghttp2/releases/download/v${NGHTTP2_VERSION}/nghttp2-${NGHTTP2_VERSION}.tar.xz"
          tar xf "nghttp2-${NGHTTP2_VERSION}.tar.xz"
          cd "nghttp2-${NGHTTP2_VERSION}"
          cmake -S . -B build -DENABLE_LIB_ONLY=ON -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/nghttp2
          cmake --build build -j
          sudo cmake --install build
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble install -y --depsOnly
      - name: Style and warnings (nimble lint)
        if: matrix.mode == 'plain'
        run: nimble lint
      - name: Run all test files
        run: |
          case "${{ matrix.mode }}" in
            asan) nimble asan ;;
            coverage) tools/coverage.sh ;;
            *) nimble test ;;
          esac
