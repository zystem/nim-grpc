name: Soak

# Memory per connection and no growth under connection churn, plain and TLS, once a week (not on every push).
# A breach opens an issue; it does not block merges. See tools/soak.sh for the thresholds.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      churn_seconds:
        description: "Length of the churn phase, seconds"
        default: "900"

permissions:
  contents: read

env:
  NGHTTP2_VERSION: 1.68.0

jobs:
  soak:
    name: soak (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, tls]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake zlib1g-dev xz-utils
      - name: nghttp2 cache
        id: ng
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/nghttp2
          key: nghttp2-${{ env.NGHTTP2_VERSION }}-${{ runner.os }}
      - name: Build nghttp2 (static, as docs/building.md)
        if: steps.ng.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://github.com/nghttp2/nghttp2/releases/download/v${NGHTTP2_VERSION}/nghttp2-${NGHTTP2_VERSION}.tar.xz"
          tar xf "nghttp2-${NGHTTP2_VERSION}.tar.xz"
          cd "nghttp2-${NGHTTP2_VERSION}"
          cmake -S . -B build -DENABLE_LIB_ONLY=ON -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/nghttp2
          cmake --build build -j
          sudo cmake --install build
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: 2.2.14
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble install -y --depsOnly
      - name: Build the load probe
        run: nim c -d:release --hints:off --nimcache:nimcache/load -o:/tmp/asyncload tools/asyncload.nim
      - name: Soak
        id: soak
        env:
          CHURN_SECONDS: ${{ github.event.inputs.churn_seconds || '900' }}
          OUT: soak-out
        run: |
          flag=""; [ "${{ matrix.mode }}" = tls ] && flag="--tls"
          tools/soak.sh $flag 2>&1 | tee soak-out.txt
          exit "${PIPESTATUS[0]}"
      - name: Keep the samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-${{ matrix.mode }}
          path: |
            soak-out/
            soak-out.txt
          retention-days: 30
      - name: Open an issue on a breach
        if: failure() && steps.soak.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The weekly soak test (${{ matrix.mode }}) breached a threshold: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"$'\n\n```\n'"$(tail -n 12 soak-out.txt)"$'\n```'
          gh issue create --title "Soak test breach (${{ matrix.mode }})" --body "$body"
